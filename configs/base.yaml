# Settings of the paper (Section 5.1, Appendix D and E).  Backbone files and experiment files
# override single entries.

seeds: [17, 29, 43]

data:
  # Pool sizes of Appendix E.1.  A smaller number takes the family-balanced prefix of a pool.
  reader_fit: 10000
  tune: 5000
  dev: 2000
  train: 50000
  test: 4800
  prelim_train: 2000
  prelim_test: 4800
  manifests: data/manifests

cache_dir: cache

reader:
  epochs: 10
  batch_pairs: 128
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  max_grad_norm: 1.0
  init_gain: 0.01
  micro_pairs: 32
  # false keeps the native feature scales (paper); true standardises per dimension
  standardize: false

routing:
  # gamma in {log 2, log 4, log 9}
  thresholds: [0.6931471805599453, 1.3862943611198906, 2.1972245773362196]
  # Each threshold trial receives this fraction of B_ref (Appendix E.2).
  trial_fraction: 0.05

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

student:
  learning_rate: 2.0e-5
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
  warmup_fraction: 0.03
  max_grad_norm: 1.0
  # 32 pairs (64 image-question examples) per update: one pair per GPU on eight GPUs with
  # four accumulation steps.
  batch_pairs: 32
  pairs_per_forward: 1

evaluation:
  max_new_tokens: 128
  batch_examples: 16

budget:
  # B_ref in GPU-hours; null profiles one fixed-H pass over the candidate pool with a pilot.
  reference_hours: null
  accounting: measured
  devices: 8
